spring:
  application:
    name: processing-worker

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: processing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.telemetry.common.models"

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:telemetry_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6380}

server:
  port: 8082

telemetry:
  thresholds:
    battery:
      critical: 20
      near-critical: 50
    temperature:
      critical-high: 80
      near-critical-high: 60
      critical-low: -20
      near-critical-low: 0
    pressure:
      critical-high: 1100
      near-critical-high: 1060
      critical-low: 900
      near-critical-low: 950

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true